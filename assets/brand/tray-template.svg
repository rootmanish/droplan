<!--
  Menu-bar / system-tray glyph for macOS, drawn as a template icon: pure
  black plus alpha, which macOS recolours for light, dark and highlighted
  menu bars. Chunkier than the app icon because it is rendered at 22pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="4.4">
      <path d="M22 7 V 21.5"/>
      <path d="M15 15 L22 22 L29 15"/>
    </g>
    <g stroke-width="2.4">
      <path d="M22 36 L10.5 30"/>
      <path d="M22 36 L33.5 30"/>
    </g>
  </g>
  <circle cx="10.5" cy="30" r="3" fill="#000000"/>
  <circle cx="33.5" cy="30" r="3" fill="#000000"/>
  <circle cx="22" cy="36" r="4" fill="#000000"/>
</svg>
