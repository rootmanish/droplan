name: Release

# Tag a commit as `v0.1.0` to publish installers for every desktop platform.
# No release server is involved: artifacts are attached to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # `secrets` isn't a valid context inside `if:` conditions, only inside
    # `env:` — so whether Apple signing is configured is resolved once here,
    # as a plain env string, and the two build steps below branch on that.
    env:
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Signing is entirely optional and, on a fork or a repo with no Apple
      # Developer account, `secrets.APPLE_CERTIFICATE` genuinely does not
      # exist. That's split into two mutually exclusive steps rather than one
      # step with all six APPLE_* vars always listed under `env:` — GitHub
      # Actions creates every key named under `env:` regardless of whether
      # the underlying secret exists, so an absent secret still produces a
      # real (empty) APPLE_CERTIFICATE environment variable. Older
      # tauri-bundler releases check only whether that variable is *present*,
      # not whether it's non-empty, and attempt to import it as a keychain
      # certificate anyway — which is what a completely secret-free repo hits
      # first, with `security: SecKeychainItemImport: ... not valid`. Never
      # setting the key at all sidesteps that regardless of bundler version.
      - name: Build (unsigned)
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'false' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DropLAN ${{ github.ref_name }}
          releaseBody: |
            Desktop builds of DropLAN.

            - macOS: `.dmg` (Apple Silicon and Intel)
            - Windows: `.exe` (NSIS) and `.msi`
            - Linux: `.AppImage` and `.deb`

            macOS builds are unsigned. Gatekeeper will quarantine the app;
            right-click → Open the first time, or run
            `xattr -dr com.apple.quarantine /Applications/DropLAN.app`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build (signed)
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DropLAN ${{ github.ref_name }}
          releaseBody: |
            Desktop builds of DropLAN.

            - macOS: `.dmg` (Apple Silicon and Intel)
            - Windows: `.exe` (NSIS) and `.msi`
            - Linux: `.AppImage` and `.deb`

            macOS builds are signed and notarised.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
